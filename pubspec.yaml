name: ikeepz
description: iKeepZ — personal finance records and an e-wallet for Android and Windows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Versions below were chosen from the real package sources at the tags listed in docs/DEPENDENCIES.md
# (Flutter 3.47.8). `pubspec.lock` is produced by the first `flutter pub get` (CI uploads it as an artifact).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # state, routing, charts
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  fl_chart: ^1.3.0

  # Firebase (identity + data + profile photo). Privileged operations go through the HTTPS API.
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  http: ^1.6.0

  # device services
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  file_picker: ^12.0.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - test_vectors/money.json
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
