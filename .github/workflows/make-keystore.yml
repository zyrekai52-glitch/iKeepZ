name: Create Android signing key

# One-time helper for owners who only have a phone. It generates a real release keystore on the runner and prints the
# four values to paste into GitHub secrets into this run's *job summary* (never into the log, never into git).
# It refuses to run in a public repository, because anyone could read the summary there.
# Afterwards: copy the values into Settings > Secrets and variables > Actions, then DELETE this workflow run.
# Back the keystore up too: if you lose it you can never publish an update that installs over the old app.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    name: Generate keystore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.repository.private == true }}
    steps:
      - name: Generate the keystore
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -keystore ikeepz-release.keystore -storetype PKCS12 \
            -alias ikeepz -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=iKeepZ, O=iKeepZ" > /dev/null 2>&1
          B64="$(base64 -w0 ikeepz-release.keystore)"
          {
            echo "## Android signing key created"
            echo ""
            echo "Create these four repository secrets (Settings > Secrets and variables > Actions), then delete this run."
            echo ""
            echo "**ANDROID_KEY_ALIAS**"
            echo '```'
            echo "ikeepz"
            echo '```'
            echo "**ANDROID_KEYSTORE_PASSWORD**"
            echo '```'
            echo "$PASS"
            echo '```'
            echo "**ANDROID_KEY_PASSWORD** (same value)"
            echo '```'
            echo "$PASS"
            echo '```'
            echo "**ANDROID_KEYSTORE_BASE64**"
            echo '```'
            echo "$B64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Keystore generated. The values are in the job summary of this run."
